# The one local check on public GitHub-hosted runners: `npm ci --ignore-scripts` and `npm run check`.
# The pack test loads the packed plugin on every stock OpenCode release in src/host/tested-hosts.json (2.2.3, 2.2.4
# and 2.2.5), installed here. The Bun-based tests run Bun 1.4.4 through
# `npx -y bun@1.4.4` from the npm scripts, so the runner needs no Bun of its own.
name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 and arm64, macOS arm64 and x64: the same four runners as every plugin's CI.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Stock OpenCode, every tested release
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "No stock OpenCode build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          for version in $(node -p "require('./src/host/tested-hosts.json').join(' ')"); do
            prefix="$RUNNER_TEMP/opencode-$version"
            npm install --prefix "$prefix" --ignore-scripts --no-save --no-audit --no-fund "@opencode/cli-$platform@$version"
            echo "OPENCODE_BIN_${version//./_}=$prefix/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done
      - run: npm run check
